<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Bem-vindo ao CareQuest – a sua saúde é uma jornada, não um destino."
    >

    <meta
        name="theme-color"
        content="#1C9770"
    >

    <title>CareQuest – Bem-vindo</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- CSS animações -->
    <link
        rel="stylesheet"
        href="../assets/css/welcome.css"
    >

</head>

<body
    class="
        min-h-screen
        overflow-hidden
        bg-gradient-to-b
        from-white
        to-emerald-50
    "
>

    <!-- Skip link -->

    <a
        href="#main-content"
        class="
            sr-only
            focus:not-sr-only
            focus:absolute
            focus:top-4
            focus:left-4
            bg-white
            text-emerald-700
            px-4
            py-2
            rounded-xl
            z-50
        "
    >
        Pular para o conteúdo
    </a>

    <!-- Layout -->

    <div
        class="
            min-h-screen
            flex
            items-center
            justify-center
            px-6
        "
    >

        <main
            id="main-content"
            class="
                flex
                flex-col
                items-center
                text-center
                gap-10
                w-full
                max-w-xl
            "
        >

            <!-- Mascote -->

            <header
                class="
                    welcome__hero
                    relative
                    w-64
                    h-64
                    md:w-72
                    md:h-72
                    flex
                    items-center
                    justify-center
                "
            >

                <!-- Halo -->

                <span
                    class="
                        welcome__halo
                        absolute
                        inset-0
                        rounded-full
                    "
                    aria-hidden="true"
                ></span>

                <!-- Mascote -->

                <img
                    src="../assets/images/mascote.png"
                    alt="Mascote do CareQuest acenando"
                    class="
                        welcome__mascot
                        relative
                        z-10
                        w-52
                        h-52
                        md:w-60
                        md:h-60
                        object-contain
                    "
                >

            </header>

            <!-- Texto -->

            <section
                class="
                    welcome__text
                    flex
                    flex-col
                    items-center
                    gap-5
                    max-w-lg
                "
            >

                <h1
                    class="
                        text-4xl
                        md:text-5xl
                        font-bold
                        text-slate-800
                        leading-tight
                    "
                >
                    Bem-vindo ao CareQuest
                </h1>

                <p
                    class="
                        text-slate-600
                        text-lg
                        md:text-xl
                        leading-relaxed
                    "
                >
                    Sua saúde é uma jornada, não um destino.
                    Vamos conquistar hábitos saudáveis juntos,
                    passo a passo.
                </p>

            </section>

            <!-- CTA -->

            <nav
                aria-label="Ação principal"
                class="
                    welcome__cta
                    w-full
                    flex
                    justify-center
                "
            >

                <a
                    href="./terms.html"
                    class="
                        welcome__button

                        w-full
                        max-w-md

                        bg-emerald-500
                        hover:bg-emerald-600

                        text-white
                        font-bold
                        text-xl

                        py-5
                        rounded-3xl

                        shadow-xl

                        transition
                        duration-300
                    "
                >
                    Continuar
                </a>

            </nav>

        </main>

    </div>

</body>

</html>
