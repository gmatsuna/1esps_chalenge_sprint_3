<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Escolha as trilhas de saúde do CareQuest para começar sua jornada.">
    <meta name="theme-color" content="#1C9770">
    <title>CareQuest – Escolha suas trilhas</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer">

    <link href="https://cdn.lineicons.com/5.1/line/lineicons.css" rel="stylesheet">

    <link rel="stylesheet" href="../assets/css/trail.css">
</head>
<body>
    <a class="skip-link" href="#main-content">Pular para o conteúdo</a>

    <div class="app-shell">
        <main id="main-content" class="trail">

            <header class="trail__intro">
                <h1>Escolha suas trilhas</h1>
                <p>Selecione até 2 caminhos que você quer percorrer agora.</p>
            </header>

            <form action="./summary.html" method="get" novalidate>
                <fieldset class="trail__list" id="trail-list"></fieldset>

                <p class="trail__counter" aria-live="polite">0 de 2 trilhas selecionadas</p>

                <nav class="trail__cta" aria-label="Ação principal">
                    <button
                        type="button"
                        class="btn-primary-cta"
                        id="btn-criar-jornada"
                    >
                        Criar minha jornada
                    </button>
                </nav>
            </form>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>

    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/trail.js"></script>

</body>
</html>
