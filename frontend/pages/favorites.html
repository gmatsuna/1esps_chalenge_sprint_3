<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareQuest – Favoritos</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen">

    <div class="max-w-5xl mx-auto p-6">

        <header class="mb-8">

            <div class="flex items-center justify-between">

                <div>

                    <p class="text-sm text-slate-500">CareQuest</p>
                    <h1 class="text-3xl font-bold text-slate-800">Missões Favoritas</h1>

                </div>

                <a
                    href="./missions.html"
                    class="
                        bg-emerald-500
                        hover:bg-emerald-600
                        text-white
                        px-4
                        py-2
                        rounded-xl
                        transition
                    "
                >
                    Voltar
                </a>

            </div>

        </header>

        <main>

            <div
                id="favorites-list"
                class="
                    grid
                    grid-cols-1
                    md:grid-cols-2
                    lg:grid-cols-3
                    gap-6
                "
            ></div>

        </main>

    </div>

    <div
        id="modal-troca"
        class="
            fixed
            inset-0
            bg-black/50
            hidden
            items-center
            justify-center
            z-50
            p-4
        "
    >

        <div class="
            bg-white
            w-full
            max-w-2xl
            rounded-3xl
            p-6
            max-h-[80vh]
            overflow-y-auto
        ">

            <div class="
                flex
                justify-between
                items-center
                mb-6
            ">

                <h2 class="
                    text-2xl
                    font-bold
                    text-slate-800
                ">
                    Trocar missão favorita
                </h2>

                <button
                    onclick="fecharModal()"
                    class="
                        text-slate-500
                        text-2xl
                    "
                >
                    ×
                </button>

            </div>

            <div
                id="modal-missoes"
                class="
                    grid
                    md:grid-cols-2
                    gap-4
                "
            >
            </div>

        </div>

    </div>

    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/favorites.js"></script>

</body>
</html>
